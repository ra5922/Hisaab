<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SplitSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark')}catch(e){}</script>
</head>
<body>
  <div id="nav"></div>
  <main class="main-content">
    <div id="flash"></div>

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-logo">💸</div>
          <h1>Create Account</h1>
          <p>Join SplitSync today</p>
        </div>

        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Rahul Sharma" required autocomplete="name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password <span class="hint">(min 6 characters)</span></label>
            <input type="password" name="password" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="btn-primary w-full">Create Account →</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/signup.js"></script>
</body>
</html>
