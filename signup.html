<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0f17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisaab">
  <link rel="manifest" href="manifest.json">
  <title>Sign Up | Hisaab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name=theme-color]').content=t==='light'?'#f4f4f8':'#0f0f17'}catch(e){}</script>
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <main class="main-content">
    <div id="flash"></div>

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <img class="brand-logo-img" src="img/logo.svg" alt="" width="64" height="64">
          <h1>Create Account</h1>
          <p>Join Hisaab today</p>
        </div>

        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Rahul Sharma" required autocomplete="name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password <span class="hint">(min 6 characters)</span></label>
            <input type="password" name="password" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="btn-primary w-full">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/signup.js"></script>
</body>
</html>
