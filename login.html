<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#7c3aed">
  <title>Login | Hisaab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark')}catch(e){}</script>
</head>
<body>
  <div id="nav"></div>
  <main class="main-content">
    <div id="flash"></div>

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <img class="brand-logo-img" src="img/logo.svg" alt="" width="64" height="64">
          <h1>Hisaab</h1>
          <p>Split expenses, not friendships</p>
        </div>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-primary w-full">Login →</button>
        </form>

        <p class="auth-switch">No account? <a href="signup.html">Sign up free</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
