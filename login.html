<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1c1d22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisaab">
  <link rel="manifest" href="manifest.json">
  <title>Login | Hisaab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name=theme-color]').content=t==='light'?'#f4f4f7':'#1c1d22'}catch(e){}</script>
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <main class="main-content">
    <div id="flash"></div>

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <img class="brand-logo-img" src="img/logo.svg" alt="" width="64" height="64">
          <h1>Hisaab</h1>
          <p>Split expenses, not friendships</p>
        </div>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label>Email</label>
            <div class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="password" name="password" placeholder="Your password" required autocomplete="current-password"></div>
          </div>
          <button type="submit" class="btn-primary w-full">Login</button>
        </form>

        <p class="auth-switch">No account? <a href="signup.html">Sign up free</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
