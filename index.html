<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1c1d22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisaab">
  <link rel="manifest" href="manifest.json">
  <title>Hisaab</title>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name=theme-color]').content=t==='light'?'#f4f4f7':'#1c1d22'}catch(e){}</script>
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <script type="module">
    import { supabase } from './js/supabase.js';
    const { data: { session } } = await supabase.auth.getSession();
    location.replace(session ? 'groups.html' : 'login.html');
  </script>
</body>
</html>
