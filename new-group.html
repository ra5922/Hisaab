<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1c1d22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisaab">
  <link rel="manifest" href="manifest.json">
  <title>New Group | Hisaab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name=theme-color]').content=t==='light'?'#f4f4f7':'#1c1d22'}catch(e){}</script>
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <div id="nav"><div class="bottom-nav" aria-hidden="true"></div></div>
  <main class="main-content">
    <div id="flash"></div>

    <div class="page-header">
      <a href="groups.html" class="back-btn" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="page-head-text">
        <h1 class="page-title">Create Group</h1>
        <p class="page-subtitle">Set up a new expense group</p>
      </div>
    </div>

    <div class="form-card plain">
      <form id="group-form">
        <div class="form-group">
          <label>Group name</label>
          <input type="text" name="name" placeholder="Goa Trip, Flat Expenses..." required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <div id="category-chips"></div>
        </div>

        <div class="form-group">
          <label>Add members <span class="hint">(you're automatically included)</span></label>
          <input type="text" name="members" placeholder="friend1@example.com, friend2@example.com">
          <p class="hint-text">Enter the email each friend used to sign up, separated by commas.</p>
        </div>

        <div class="form-actions">
          <a href="groups.html" class="btn-ghost">Cancel</a>
          <button type="submit" class="btn-primary">Create group</button>
        </div>
      </form>
    </div>
  </main>
  <script type="module" src="js/pages/new-group.js"></script>
</body>
</html>
